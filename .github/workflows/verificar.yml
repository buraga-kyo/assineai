name: verificar

on:
  pull_request:
  push:
    branches: [main]

# só leitura por padrão; o job que precisar de mais pede no próprio job
permissions:
  contents: read

# push novo no mesmo PR cancela a rodada anterior (poupa minutos da cota)
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck, lint e teste
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # sem `version`: a action lê a versão do campo packageManager
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verificar

  segredos:
    name: segredo no código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # o gitleaks comenta no PR a linha do achado
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico inteiro, para varrer só os commits do PR
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
