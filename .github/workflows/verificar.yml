# Verificação de todo PR e de todo push na main: typecheck, lint, teste,
# segredo no código e dependência com falha conhecida.
#
# O resultado é só aviso. Não existe regra de branch protegida, então o
# vermelho aparece no PR e na hora de mergear, mas a decisão de mergear
# continua sendo de quem revisa.
#
# Para rodar o mesmo na sua máquina, na raiz do repositório:
#   pnpm install --frozen-lockfile && pnpm verificar
#   gitleaks detect --no-git --source .
#   osv-scanner scan source --lockfile=pnpm-lock.yaml
#
# As actions ficam presas na tag maior (v7, v6, v3), menos o osv-scanner,
# que só publica versão exata.

name: verificar

on:
  pull_request:
  push:
    branches: [main]

# só leitura por padrão; o job que precisar de mais pede no próprio job
permissions:
  contents: read

# push novo no mesmo PR cancela a rodada anterior (poupa minutos da cota)
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck, lint e teste
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # sem `version`: a action lê a versão do campo packageManager
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: bash infra/dev.sh up
      - run: pnpm db:migrar
        env:
          BANCO_URL_MIGRACAO: postgres://assineai_migracao:migracao_dev@localhost:5432/assineai
      - run: pnpm verificar
        env:
          BANCO_URL: postgres://assineai_app:app_dev@localhost:5432/assineai
          REDIS_URL: redis://localhost:6379
          ARMAZENAMENTO_ENDPOINT: http://localhost:9000
          ARMAZENAMENTO_REGIAO: us-east-1
          ARMAZENAMENTO_BUCKET: assineai
          ARMAZENAMENTO_CHAVE: minioadmin
          ARMAZENAMENTO_SEGREDO: minioadmin
          CHAVE_OTP: teste123teste123teste123teste123
          CORS_ORIGENS: http://localhost:5173
          CHAVE_MESTRA: teste123teste123teste123teste123

  segredos:
    name: segredo no código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # o gitleaks comenta no PR a linha do achado
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico inteiro, para varrer só os commits do PR
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: dependência com falha conhecida
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # esse repositório não publica tag maior, então fica na versão exata
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: --lockfile=pnpm-lock.yaml
