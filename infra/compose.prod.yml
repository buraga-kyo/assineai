# Compose de producao do AssineAi, so o pedaco desta issue: o Postgres e o
# servico `migracao`, que aplica as migrations e sai. A api, o worker e o
# caddy entram na issue de deploy; api e worker vao depender de
# `migracao: condition: service_completed_successfully`, para nunca subirem
# com esquema atrasado.
#
# Sobe com um .env de producao NAO versionado (docker compose --env-file;
# os nomes estao em infra/.env.prod.example). As senhas das roles vem desse
# .env: infra/postgres-init-prod/01-roles.sh cria assineai_migracao e
# assineai_app com elas no primeiro boot do volume (e so nele: o init do
# Postgres nao roda de novo com o volume ja criado). A URL da migracao e
# montada aqui com a mesma senha, para nao existir segundo lugar para errar.
name: assineai-prod

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    # sem porta publicada: so os servicos desta rede falam com o banco
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assineai}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA no .env de producao}
      # lidas pelo 01-roles.sh no primeiro boot do volume
      ASSINEAI_MIGRACAO_SENHA: ${ASSINEAI_MIGRACAO_SENHA:?defina ASSINEAI_MIGRACAO_SENHA no .env de producao}
      ASSINEAI_APP_SENHA: ${ASSINEAI_APP_SENHA:?defina ASSINEAI_APP_SENHA no .env de producao}
    volumes:
      # a imagem do Postgres 18 guarda os dados em /var/lib/postgresql/18/docker
      - postgres-dados:/var/lib/postgresql
      # roles de producao com as senhas do ambiente (nao o postgres-init de dev)
      - ./postgres-init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d assineai"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Roda `node apps/api/dist/banco/migrar.js` e sai com 0 (Exited 0 e o normal).
  migracao:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: migracao
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_NIVEL: info
      BANCO_URL_MIGRACAO: postgres://assineai_migracao:${ASSINEAI_MIGRACAO_SENHA}@postgres:5432/${POSTGRES_DB:-assineai}
    command: ["node", "apps/api/dist/banco/migrar.js"]

volumes:
  postgres-dados:
