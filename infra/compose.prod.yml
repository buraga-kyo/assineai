name: assineai-prod

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assineai}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA no .env de producao}
      ASSINEAI_MIGRACAO_SENHA: ${ASSINEAI_MIGRACAO_SENHA:?defina ASSINEAI_MIGRACAO_SENHA no .env de producao}
      ASSINEAI_APP_SENHA: ${ASSINEAI_APP_SENHA:?defina ASSINEAI_APP_SENHA no .env de producao}
    volumes:
      - postgres-dados:/var/lib/postgresql
      - ./postgres-init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${POSTGRES_DB:-assineai}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    volumes:
      - minio-dados:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 3

  migracao:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: migracao
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_NIVEL: info
      BANCO_URL_MIGRACAO: postgres://assineai_migracao:${ASSINEAI_MIGRACAO_SENHA}@postgres:5432/${POSTGRES_DB:-assineai}
    command: ["node", "apps/api/dist/banco/migrar.js"]

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      migracao:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORTA_API: 3000
      BANCO_URL: postgres://assineai_app:${ASSINEAI_APP_SENHA}@postgres:5432/${POSTGRES_DB:-assineai}
      REDIS_URL: redis://redis:6379
      ARMAZENAMENTO_ENDPOINT: http://minio:9000
      ARMAZENAMENTO_REGIAO: sa-east-1
      ARMAZENAMENTO_BUCKET: assineai
      ARMAZENAMENTO_CHAVE: ${MINIO_ROOT_USER}
      ARMAZENAMENTO_SEGREDO: ${MINIO_ROOT_PASSWORD}
      CHAVE_OTP: ${CHAVE_OTP}
      CORS_ORIGENS: ${CORS_ORIGENS}
      CHAVE_MESTRA: ${CHAVE_MESTRA}
    command: ["node", "apps/api/dist/servidor.js"]

  worker:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      migracao:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BANCO_URL: postgres://assineai_app:${ASSINEAI_APP_SENHA}@postgres:5432/${POSTGRES_DB:-assineai}
      REDIS_URL: redis://redis:6379
      CHAVE_MESTRA: ${CHAVE_MESTRA}
    # Command ja esta no dockerfile (worker.js)

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres-dados:
  minio-dados:
  caddy_data:
  caddy_config:
