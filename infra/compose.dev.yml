# Infra de desenvolvimento do AssineAi: Postgres com PostGIS, Redis, MinIO com
# o bucket assineai e Mailpit. Sobe com `bash infra/dev.sh up` (infra/README.md).
# A Evolution (WhatsApp) entra na issue do canal WhatsApp.
# As portas ficam só no localhost da máquina: as senhas de dev são públicas.
name: assineai-dev

services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: assineai-dev-postgres
    environment:
      POSTGRES_DB: assineai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # a imagem do Postgres 18 guarda os dados em /var/lib/postgresql/18/docker;
      # montar em /var/lib/postgresql/data deixaria o volume nomeado vazio
      - postgres-dados:/var/lib/postgresql
      # roda uma vez, no primeiro boot do volume: cria as roles (01-roles.sql)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # por TCP de proposito: o boot inicial so abre o socket unix, e nao conta
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d assineai"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: assineai-dev-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: assineai-dev-minio
    command: server /data --console-address ":9001"
    environment: &minio-credenciais
      # mesmos valores de ARMAZENAMENTO_CHAVE e ARMAZENAMENTO_SEGREDO no .env.example
      MINIO_ROOT_USER: assineai
      MINIO_ROOT_PASSWORD: assineai-dev-segredo
    ports:
      - "127.0.0.1:9000:9000" # API S3
      - "127.0.0.1:9001:9001" # console web
    volumes:
      - minio-dados:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # cria o bucket assineai assim que o MinIO responde e sai (Exited 0 e o normal)
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: assineai-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment: *minio-credenciais
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/assineai &&
        mc ls local

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: assineai-dev-mailpit
    ports:
      - "127.0.0.1:8025:8025" # caixa de entrada web
      - "127.0.0.1:1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dados:
  minio-dados:
