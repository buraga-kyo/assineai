server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API proxies devem ser tratados pelo Caddy ou Ingress superior,
    # Mas caso bata direto no nginx (o que não deve acontecer no nosso setup, 
    # pois o Caddy faz o roteamento)
    location /api/ {
        proxy_pass http://api:3000/;
    }
}
